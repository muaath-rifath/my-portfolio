<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="color-scheme" content="light dark" />
  <meta name="supported-color-schemes" content="light dark" />
  <title>Muaath Rifath</title>
  <style type="text/css">
    :root {
      color-scheme: light dark;
      supported-color-schemes: light dark;
    }
    body, .email-body {
      margin: 0 !important;
      padding: 0 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
      color: #241f1c;
      background-color: transparent !important;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }
    table, td {
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
      border-collapse: collapse;
    }
    img {
      border: 0;
      outline: none;
      text-decoration: none;
      -ms-interpolation-mode: bicubic;
    }

    /* DESKTOP & MOBILE RESPONSIVE BEHAVIOR */
    .responsive-wrapper {
      width: 100% !important;
      max-width: 600px !important;
    }

    @media only screen and (max-width: 600px) {
      .responsive-wrapper {
        width: 100% !important;
        max-width: 100% !important;
      }
      .responsive-cell {
        padding-left: 14px !important;
        padding-right: 14px !important;
      }
    }

    /* DARK MODE */
    @media (prefers-color-scheme: dark) {
      body, .email-body {
        color: #faf9f4 !important;
      }
      .brand-title {
        color: #8fffaa !important;
      }
      .brand-title-muted, .footer-text {
        color: #b6afa9 !important;
      }
      .header-divider, .footer-divider {
        border-color: #3b302d !important;
      }
      .content-text {
        color: #faf9f4 !important;
      }
      .content-text a, .footer-text a {
        color: #8fffaa !important;
      }
    }

    /* OUTLOOK WEB / APP DARK MODE */
    [data-ogsc] body, [data-ogsc] .email-body {
      color: #faf9f4 !important;
    }
    [data-ogsc] .brand-title {
      color: #8fffaa !important;
    }
    [data-ogsc] .brand-title-muted, [data-ogsc] .footer-text {
      color: #b6afa9 !important;
    }
    [data-ogsc] .header-divider, [data-ogsc] .footer-divider {
      border-color: #3b302d !important;
    }
    [data-ogsc] .content-text {
      color: #faf9f4 !important;
    }
    [data-ogsc] .content-text a, [data-ogsc] .footer-text a {
      color: #8fffaa !important;
    }
  </style>
</head>
<body class="email-body" style="margin: 0; padding: 0; background-color: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #241f1c;">
  
  <!-- CENTER CONTAINER (FLUID-HYBRID FOR 100% MOBILE & DESKTOP COMPATIBILITY) -->
  <center style="width: 100%; background-color: transparent;">
    <div class="responsive-wrapper" style="max-width: 600px; width: 100%; margin: 0 auto; text-align: left;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; max-width: 600px; margin: 0 auto; border-collapse: collapse;">
        <tr>
          <td class="responsive-cell" style="padding: 16px 16px 24px 16px; box-sizing: border-box;">

            <!-- HEADER (CENTERED LOGO + BRAND) -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; border-collapse: collapse;">
              <tr>
                <td align="center" class="header-divider" style="padding: 0 0 14px 0; border-bottom: 1px solid #e8e5e1; text-align: center;">
                  <table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0" style="margin: 0 auto; border-collapse: collapse; vertical-align: middle;">
                    <tr>
                      <!-- LOGO -->
                      <td valign="middle" style="padding: 0 8px 0 0; vertical-align: middle; line-height: 0;">
                        <a href="https://www.muaathrifath.me" target="_blank" style="text-decoration: none; display: inline-block; vertical-align: middle;">
                          <img src="https://www.muaathrifath.me/assets/logo-portfolio.png" width="26" height="26" alt="Muaath Rifath" style="display: block; width: 26px; height: 26px; border-radius: 50%; border: 0; outline: none; vertical-align: middle;" />
                        </a>
                      </td>
                      <!-- BRAND TEXT -->
                      <td valign="middle" style="padding: 0; vertical-align: middle; line-height: 1;">
                        <a href="https://www.muaathrifath.me" target="_blank" class="brand-title" style="text-decoration: none; font-size: 18px; font-weight: 700; color: #006b42; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1; vertical-align: middle; white-space: nowrap;">
                          Muaath <span class="brand-title-muted" style="color: #76716d; font-weight: 500;">Rifath</span>
                        </a>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>

            <!-- CONTENT AREA (FLUID WIDTH & RESPONSIVE TEXT) -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; border-collapse: collapse;">
              <tr>
                <td class="content-text" style="padding: 20px 0 24px 0; font-size: 15px; line-height: 1.6; color: #241f1c; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; word-break: break-word; overflow-wrap: break-word;">
                  <p style="margin: 0 0 16px 0;">Hi there,</p>
                  <p style="margin: 0 0 16px 0;">Type your message content here...</p>
                  <p style="margin: 0;">Best regards,<br /><strong>Muaath Rifath</strong></p>
                </td>
              </tr>
            </table>

            <!-- FOOTER -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; border-collapse: collapse;">
              <tr>
                <td class="footer-divider footer-text" style="padding: 14px 0 0 0; border-top: 1px solid #e8e5e1; font-size: 12px; line-height: 18px; color: #76716d; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
                  Freelance Software Developer &bull; <a href="https://www.muaathrifath.me" target="_blank" style="color: #006b42; text-decoration: none;">muaathrifath.me</a>
                </td>
              </tr>
            </table>

          </td>
        </tr>
      </table>
    </div>
  </center>
</body>
</html>
