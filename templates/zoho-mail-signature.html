<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light dark" />
  <meta name="supported-color-schemes" content="light dark" />
  <style>
    :root { color-scheme: light dark; supported-color-schemes: light dark; }
    .sig-name { color: #006b42 !important; font-size: 15px; font-weight: 700; text-decoration: none; }
    .sig-name-muted { color: #76716d !important; font-weight: 500; }
    .sig-title { color: #5c5752 !important; font-size: 13px; margin-top: 2px; }
    .sig-link { color: #006b42 !important; font-size: 12px; text-decoration: none; font-weight: 600; }
    .sig-separator { color: #d0c9c3; margin: 0 4px; }
    .sig-border { border-left: 2px solid #006b42 !important; }
    .dark-logo { display: none !important; max-height: 0px; }

    @media (prefers-color-scheme: dark) {
      .sig-name { color: #8fffaa !important; }
      .sig-name-muted { color: #b6afa9 !important; }
      .sig-title { color: #d0c9c3 !important; }
      .sig-link { color: #8fffaa !important; }
      .sig-border { border-left-color: #8fffaa !important; }
      .light-logo { display: none !important; }
      .dark-logo { display: block !important; max-height: none !important; }
    }

    [data-ogsc] .sig-name { color: #8fffaa !important; }
    [data-ogsc] .sig-name-muted { color: #b6afa9 !important; }
    [data-ogsc] .sig-title { color: #d0c9c3 !important; }
    [data-ogsc] .sig-link { color: #8fffaa !important; }
    [data-ogsc] .sig-border { border-left-color: #8fffaa !important; }
    [data-ogsc] .light-logo { display: none !important; }
    [data-ogsc] .dark-logo { display: block !important; max-height: none !important; }
  </style>
